<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="ec-build" content="23">
<title>영어 말하기 코치</title>
<link rel="icon" type="image/png" href="icons/icon-192.png?v=23">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=23">
<link rel="manifest" href="manifest.json?v=23">
<meta name="apple-mobile-web-app-title" content="영어 코치">
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1d1f23; --sub:#5d636e; --line:#e2e0d9;
  --brand:#2f5d50; --brand-ink:#ffffff; --good:#2e7d4f; --mid:#a86a12; --bad:#c0392b; --chip:#eef1ee;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#15171a; --card:#1e2125; --ink:#eceef1; --sub:#a2a9b4; --line:#30343a;
    --brand:#6fb7a0; --brand-ink:#10231d; --good:#63c58a; --mid:#e0ac4f; --bad:#f07a6b; --chip:#272b30; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
p{margin:6px 0}
.ec-wrap{max-width:720px;margin:0 auto;padding:14px 14px calc(120px + env(safe-area-inset-bottom))}
.ec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 2px 12px}
.ec-head h1{font-size:20px;margin:0}
.ec-gear{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);font:inherit;font-size:14px}
.ec-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.ec-card h2{font-size:16px;margin:0 0 8px}
.ec-card h3,.ec-turn h3{font-size:14px;margin:14px 0 4px;color:var(--sub)}
.ec-sub{color:var(--sub);font-size:14px}
.ec-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.ec-row.between{justify-content:space-between}
.ec-row.end{justify-content:flex-end}
.ec-row:empty{display:none}
.ec-btn{padding:12px 16px;border-radius:11px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);font:inherit;font-weight:600}
.ec-btn.ghost{background:transparent;color:var(--brand)}
.ec-btn.small{padding:7px 12px;font-size:14px}
.ec-btn.wide{display:block;width:100%;margin-top:12px}
.ec-btn.rec{display:block;width:100%;font-size:18px;padding:16px;margin-top:10px}
.ec-btn.rec.on{background:var(--bad);border-color:var(--bad);color:#fff}
.ec-btn:disabled{opacity:.5}
.ec-mini{padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--brand);font:inherit;font-size:13px;font-weight:400;vertical-align:middle;white-space:nowrap}
.ec-chip{padding:3px 10px;border-radius:999px;border:1px solid var(--mid);color:var(--mid);background:transparent;font:inherit;font-size:13px;margin-top:4px}
.ec-msg{margin-top:10px;padding:10px 12px;border-radius:9px;font-size:14px;background:var(--chip)}
.ec-gate{text-align:center;padding:28px 20px}
.ec-gate h2{font-size:22px;margin:10px 0 8px}
.ec-gateimg{border-radius:20px}
.ec-gate .ec-btn{margin:10px auto}
body.ec-gated #ecNav,body.ec-gated .ec-fab,body.ec-gated .ec-head button{display:none}
.ec-hr{border:0;border-top:1px solid var(--line);margin:16px 0 12px}
.ec-h3{font-size:15px;margin:0 0 6px}
.ec-msg.err{border:1px solid var(--bad);color:var(--bad);background:transparent}
#ecWarn .ec-msg{margin:0 0 12px}
.ec-flash{display:block;width:100%;text-align:left;margin:0 0 12px;padding:12px 14px;border-radius:11px;border:1px solid var(--brand);background:var(--chip);color:var(--ink);font:inherit;font-size:15px}
.ec-flash b{color:var(--brand);white-space:nowrap}
.ec-scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:8px;margin:8px 0}
.ec-score{border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center}
.ec-score b{display:block;font-size:24px;line-height:1.2}
.ec-score b.ec-stat{font-size:17px;line-height:1.7}
.ec-score span{font-size:12px;color:var(--sub)}
.s-good{color:var(--good)} .s-mid{color:var(--mid)} .s-bad{color:var(--bad)}
textarea,input[type=text],input[type=password],input[type=file],select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:14px;color:var(--sub);margin:10px 0 4px}
.ec-check{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px}
.ec-check input{width:20px;height:20px;flex:none}
.ec-seg{display:flex;gap:6px;margin-bottom:10px}
.ec-seg button{flex:1;padding:10px 6px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;font:inherit;font-size:15px}
.ec-seg button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink);font-weight:600}
.ec-item{display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:6px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font:inherit;font-size:15px}
.ec-item small{display:block;color:var(--sub);font-size:13px;margin-top:2px}
.ec-task{font-size:18px;line-height:1.5;padding:12px;border-radius:10px;background:var(--chip);margin:10px 0}
.ec-task.en{font-size:19px}
.ec-task small{display:block;color:var(--sub);font-size:14px;margin-top:6px}
.ec-script{white-space:pre-wrap;max-height:40vh;overflow:auto;font-size:17px}
.ec-answer{border:1px solid var(--good);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:18px}
.ec-answer small{display:block;color:var(--sub);font-size:12px}
.ec-focus{font-size:14px;border-left:3px solid var(--mid);padding:2px 0 2px 10px;margin:6px 0}
.ec-prog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--sub);margin-bottom:4px}
.ec-prog .ec-bar{flex:1}
.ec-bar{height:8px;border-radius:999px;background:var(--chip);overflow:hidden;margin:8px 0}
.ec-bar i{display:block;height:100%;background:var(--brand);border-radius:999px}
.ec-big{font-size:34px;font-weight:700;text-align:center;margin:0 0 10px}
.ec-res{border-left:4px solid var(--line);padding:6px 0 6px 12px;margin:12px 0}
.ec-res.ok{border-color:var(--good)} .ec-res.no{border-color:var(--bad)}
.ec-res-h{font-size:16px}
.ec-res-h>b{margin-right:4px}
.ec-res.ok .ec-res-h>b{color:var(--good)} .ec-res.no .ec-res-h>b{color:var(--bad)}
.ec-tip{font-size:15px;margin-top:4px}
.ec-kv{font-size:13px;color:var(--sub);margin-top:6px}
.ec-bub{border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--brand);color:var(--brand-ink);font-size:17px;line-height:1.5}
.ec-bub small{display:block;opacity:.8;font-size:12px;margin-bottom:2px}
.ec-bub .ec-mini{border-color:var(--brand-ink);color:var(--brand-ink);margin-top:8px;padding:4px 12px}
.ec-turn{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.ec-turn .ec-row.between{margin-top:0}
.ec-said{font-size:16px;margin-top:6px}
.ec-said.small{font-size:14px;color:var(--sub)}
.ec-fold{display:flex;width:100%;justify-content:space-between;gap:10px;align-items:center;text-align:left;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.ec-fold span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ec-fold small{color:var(--sub);margin-right:6px}
.ec-fix{border-left:3px solid var(--line);padding:4px 0 4px 10px;margin:8px 0;font-size:15px}
.ec-fix del{color:var(--bad);text-decoration:line-through}
.ec-fix b{color:var(--good)}
.ec-nat{font-size:17px;padding:10px 12px;border-radius:10px;background:var(--chip)}
.ec-chunks{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.ec-chunk{display:inline-flex;flex-direction:column;padding:6px 10px;border-radius:9px;border:1px solid var(--line)}
.ec-chunk b{font-size:16px}
.ec-chunk i{font-style:normal;font-size:13px;color:var(--sub)}
.ec-alert{border:1px solid var(--mid);border-radius:9px;padding:8px 12px;margin:10px 0;font-size:15px}
.ec-alert.good{border-color:var(--good)}
.ec-level{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.ec-level>b{font-size:40px;line-height:1;color:var(--brand);min-width:76px}
.ec-lvs{font-size:18px;font-weight:600}
.ec-goal{font-size:14px;margin:12px 0 4px}
.ec-today{font-size:24px}
.ec-steps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 0}
.ec-step{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-size:14px}
.ec-step b{font-size:15px;color:var(--sub)}
.ec-step.done{border-color:var(--good)} .ec-step.done b{color:var(--good)}
.ec-miss{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-size:15px;margin-top:8px}
.ec-miss i{flex:none;width:22px;height:22px;border:2px solid var(--sub);border-radius:6px;font-style:normal;text-align:center;line-height:18px;color:var(--good);font-weight:700}
.ec-miss.done{border-color:var(--good)} .ec-miss.done i{border-color:var(--good)} .ec-miss.done span{color:var(--sub)}
.ec-badge{font-style:normal;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--sub);font-weight:400;white-space:nowrap}
.ec-badge.good{border-color:var(--good);color:var(--good)} .ec-badge.bad{border-color:var(--bad);color:var(--bad)}
.ec-cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:2px}
.ec-cat{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:14px}
.ec-cat[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.ec-ph{border-top:1px solid var(--line);padding:10px 0}
.ec-ph .ec-row{margin-top:6px}
table.ec-t{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.ec-t th,table.ec-t td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.ec-t th{color:var(--sub);font-weight:400;font-size:13px}
.ec-chart{width:100%;height:auto;display:block}
.ec-chart .grid{stroke:var(--line);stroke-dasharray:3 3;stroke-width:1}
.ec-chart .lab{fill:var(--sub);font-size:9px}
.ec-chart .ln{fill:none;stroke:var(--brand);stroke-width:2}
.ec-chart .pt{fill:var(--brand)}
.ec-chart .bar{fill:var(--sub);opacity:.4}
.ec-chart .bar.full{fill:var(--brand);opacity:1}
.ec-chart .goal{stroke:var(--mid);stroke-width:1;stroke-dasharray:4 3}
.ec-ul,.ec-ol{padding-left:20px;margin:6px 0;font-size:15px}
.ec-ul li,.ec-ol li{margin-bottom:6px}
.ec-diag{list-style:none;padding-left:0;font-size:14px}
.ec-gap{margin-top:12px}
.ec-ver{font-size:12px;color:var(--sub);text-align:center}
.ec-stagehead{margin:0 0 10px}
.ec-talkhead{margin:0 0 8px}
.ec-nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.ec-navb{flex:1;position:relative;padding:13px 2px 11px;border:0;background:transparent;color:var(--sub);font:inherit;font-size:14px}
.ec-navb[aria-current="page"]{color:var(--brand);font-weight:700;box-shadow:inset 0 3px 0 var(--brand)}
.ec-dot{position:absolute;top:9px;left:calc(50% + 16px);width:8px;height:8px;border-radius:50%;background:var(--bad)}
.ec-fab{position:fixed;right:10px;bottom:calc(60px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;z-index:21}
.ec-fab button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
</style>
</head>
<body>
<div class="ec-wrap">
  <header class="ec-head">
    <h1>영어 말하기 코치</h1>
    <button class="ec-gear" data-act="tab" data-arg="set">설정</button>
  </header>
  <div id="ecWarn"></div>
  <main id="ecMain"></main>
</div>
<div class="ec-fab">
  <button data-act="top" aria-label="맨 위로">▲</button>
  <button data-act="bottom" aria-label="맨 아래로">▼</button>
</div>
<nav class="ec-nav" id="ecNav" aria-label="화면 이동"></nav>
<script src="js/data.js?v=23"></script>
<script src="js/core.js?v=23"></script>
<script src="js/sync.js?v=23"></script>
<script src="js/app.js?v=23"></script>
</body>
</html>
